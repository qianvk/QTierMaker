name: Platform Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cpack_generator: DragNDrop
            artifact_name: QTierMaker-macOS
            runtime_metadata: ''
          - os: windows-latest
            cpack_generator: NSIS
            artifact_name: QTierMaker-Windows
            runtime_metadata: dist/QTierMaker-Windows-runtime-version.txt
    runs-on: ${{ matrix.os }}
    # A clean arm64 Qt build can take around 40 minutes on GitHub's macOS runners.
    timeout-minutes: 75
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN != '' && secrets.SUBMODULE_TOKEN || github.token }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          modules: qtimageformats
          cache: true

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Resolve package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "QTM_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'qtiermaker-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: bash
        run: |
          platform_args=()
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            platform_args+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
          else
            platform_args+=(-A x64)
          fi
          # Let CMake select the platform-native generator. In particular, forcing
          # Ninja on Windows can pair MinGW from PATH with the MSVC Qt package.
          cmake -S . -B build/package \
            -DCMAKE_BUILD_TYPE=Release \
            -DQTM_BUILD_TESTS=ON \
            "-DQTM_PACKAGE_VERSION=${QTM_PACKAGE_VERSION}" \
            "${platform_args[@]}"

      - name: Build
        run: cmake --build build/package --config Release --parallel

      - name: Test
        run: ctest --test-dir build/package --output-on-failure -C Release

      - name: Sign Windows application
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signTool) { throw 'signtool.exe was not found' }
          & $signTool.FullName sign /fd SHA256 /td SHA256 `
            /tr https://timestamp.digicert.com `
            /f $env:WINDOWS_CERTIFICATE_PATH `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            build/package/Release/QTierMaker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: >-
          cpack --config build/package/CPackConfig.cmake
          -C Release
          -G ${{ matrix.cpack_generator }}
          -B dist

      - name: Build Windows executable update
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build/package --config Release --target QTierMakerUpdatePackage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/package/updates/*-WinUpdate-*.exe dist/
          Copy-Item build/package/QTierMaker-Windows-runtime-version.txt dist/

      - name: Build macOS application update
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --build build/package --config Release --target QTierMakerMacUpdatePackage
          cp build/package/updates/*-macOS-arm64-Update.zip dist/

      - name: Audit minimized macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          update_app="build/package/updates/macos-stage/QTierMaker.app"
          cmake -DQTM_APPLICATION="${update_app}" -DQTM_AUDIT_ONLY=ON \
            -P packaging/macos/FinalizeBundle.cmake
          "${update_app}/Contents/MacOS/QTierMaker" --deployment-smoke-test

          dmg_path="$(find dist -maxdepth 1 -name '*-macOS-arm64.dmg' -print -quit)"
          test -n "${dmg_path}"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true
            rmdir "${mount_dir}" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "${mount_dir}" "${dmg_path}" >/dev/null
          dmg_app="${mount_dir}/QTierMaker.app"
          cmake -DQTM_APPLICATION="${dmg_app}" -DQTM_AUDIT_ONLY=ON \
            -P packaging/macos/FinalizeBundle.cmake
          "${dmg_app}/Contents/MacOS/QTierMaker" --deployment-smoke-test

          echo "Minimized app: $(du -sh "${update_app}" | cut -f1)"
          echo "DMG: $(du -sh "${dmg_path}" | cut -f1)"
          echo "Update ZIP: $(du -sh dist/*-macOS-arm64-Update.zip | cut -f1)"

      - name: Audit Windows runtime payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build/package --config Release `
            --prefix "${{ github.workspace }}/runtime-audit"
          $forbidden = @(
            'd3dcompiler_47.dll',
            'dxcompiler.dll',
            'dxil.dll',
            'opengl32sw.dll',
            'vc_redist.x64.exe'
          )
          $unexpected = Get-ChildItem runtime-audit -Recurse -File |
            Where-Object { $forbidden -contains $_.Name.ToLowerInvariant() }
          if ($unexpected) {
            throw "Forbidden deployment dependencies: $($unexpected.Name -join ', ')"
          }
          $required = @(
            'msvcp140.dll',
            'msvcp140_1.dll',
            'msvcp140_2.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll'
          )
          foreach ($name in $required) {
            if (-not (Test-Path "runtime-audit/bin/$name")) {
              throw "Missing required MSVC runtime: $name"
            }
          }

      - name: Sign Windows release packages
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          foreach ($package in Get-ChildItem dist/*.exe) {
            & $signTool.FullName sign /fd SHA256 /td SHA256 `
              /tr https://timestamp.digicert.com `
              /f $env:WINDOWS_CERTIFICATE_PATH `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              $package.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Generate checksum
        shell: bash
        run: |
          while IFS= read -r artifact; do
            cmake -E sha256sum "${artifact}" > "${artifact}.sha256"
          done < <(find dist -maxdepth 1 \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -print)

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.exe
            dist/*.exe.sha256
            dist/*.zip
            dist/*.zip.sha256
            ${{ matrix.runtime_metadata }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/qtiermaker-signing.pfx"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          pattern: QTierMaker-*
          path: release-assets
          merge-multiple: true

      - name: Generate update manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel="stable"
          if [[ "${version}" == *-* ]]; then
            channel="beta"
          fi
          windows_path="$(find release-assets -maxdepth 1 -name '*-Windows-x64-Setup.exe' -print -quit)"
          windows_update_path="$(find release-assets -maxdepth 1 -name '*-WinUpdate-*.exe' -print -quit)"
          macos_path="$(find release-assets -maxdepth 1 -name '*-macOS-arm64.dmg' -print -quit)"
          macos_update_path="$(find release-assets -maxdepth 1 -name '*-macOS-arm64-Update.zip' -print -quit)"
          runtime_path="release-assets/QTierMaker-Windows-runtime-version.txt"
          test -n "${windows_path}" && test -n "${windows_update_path}" && \
            test -n "${macos_path}" && test -n "${macos_update_path}" && \
            test -f "${runtime_path}"

          windows_name="$(basename "${windows_path}")"
          windows_update_name="$(basename "${windows_update_path}")"
          macos_name="$(basename "${macos_path}")"
          macos_update_name="$(basename "${macos_update_path}")"
          windows_sha="$(shasum -a 256 "${windows_path}" | cut -d ' ' -f 1)"
          windows_update_sha="$(shasum -a 256 "${windows_update_path}" | cut -d ' ' -f 1)"
          macos_sha="$(shasum -a 256 "${macos_path}" | cut -d ' ' -f 1)"
          macos_update_sha="$(shasum -a 256 "${macos_update_path}" | cut -d ' ' -f 1)"
          windows_size="$(stat -f '%z' "${windows_path}")"
          windows_update_size="$(stat -f '%z' "${windows_update_path}")"
          macos_size="$(stat -f '%z' "${macos_path}")"
          macos_update_size="$(stat -f '%z' "${macos_update_path}")"
          runtime_version="$(tr -d '\r\n' < "${runtime_path}")"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          asset_root="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          jq -n \
            --arg channel "${channel}" \
            --arg version "${version}" \
            --arg release_url "${release_url}" \
            --arg asset_root "${asset_root}" \
            --arg windows_name "${windows_name}" \
            --arg windows_sha "${windows_sha}" \
            --argjson windows_size "${windows_size}" \
            --arg windows_update_name "${windows_update_name}" \
            --arg windows_update_sha "${windows_update_sha}" \
            --argjson windows_update_size "${windows_update_size}" \
            --arg runtime_version "${runtime_version}" \
            --arg macos_name "${macos_name}" \
            --arg macos_sha "${macos_sha}" \
            --argjson macos_size "${macos_size}" \
            --arg macos_update_name "${macos_update_name}" \
            --arg macos_update_sha "${macos_update_sha}" \
            --argjson macos_update_size "${macos_update_size}" \
            '{
              "schema-version": 2,
              channel: $channel,
              localizations: {
                en: {
                  changelog: ("QTierMaker " + $version + " is available. On macOS, allow the app from System Settings > Privacy & Security on first launch. See the release page for details.")
                },
                zh_CN: {
                  changelog: ("QTierMaker " + $version + " 已发布。macOS 首次启动时，请在系统设置 > 隐私与安全性中选择仍要打开。详细内容请查看发布页面。")
                }
              },
              updates: {
                windows: {
                  "latest-version": $version,
                  "runtime-version": $runtime_version,
                  "download-url": ($asset_root + "/" + $windows_name),
                  "release-url": $release_url,
                  "file-name": $windows_name,
                  sha256: $windows_sha,
                  size: $windows_size,
                  update: {
                    "download-url": ($asset_root + "/" + $windows_update_name),
                    "file-name": $windows_update_name,
                    sha256: $windows_update_sha,
                    size: $windows_update_size
                  }
                },
                macos: {
                  "latest-version": $version,
                  "download-url": ($asset_root + "/" + $macos_name),
                  "release-url": $release_url,
                  "file-name": $macos_name,
                  sha256: $macos_sha,
                  size: $macos_size,
                  update: {
                    "download-url": ($asset_root + "/" + $macos_update_name),
                    "file-name": $macos_update_name,
                    sha256: $macos_update_sha,
                    size: $macos_update_size
                  }
                }
              }
            }' > release-assets/updates.json
          rm -f "${runtime_path}"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notice_marker='<!-- qtiermaker-macos-open-anyway -->'
          macos_notice="${notice_marker}
          ### macOS first launch

          This build is not notarized. After copying QTierMaker to Applications, try to open it once, then open **System Settings > Privacy & Security** and choose **Open Anyway**.

          ### macOS 首次启动

          此版本未经 Apple 公证。将 QTierMaker 复制到“应用程序”并尝试启动一次，然后前往 **系统设置 > 隐私与安全性**，选择 **仍要打开**。"

          release_flags=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/*.exe \
              release-assets/*.dmg \
              release-assets/*.zip \
              release-assets/updates.json \
              --clobber
            current_notes="$(gh release view "${GITHUB_REF_NAME}" --json body --jq '.body // ""')"
            if [[ "${current_notes}" != *"${notice_marker}"* ]]; then
              current_notes="${macos_notice}

          ${current_notes}"
            fi
            gh release edit "${GITHUB_REF_NAME}" "${release_flags[@]}" \
              --title "QTierMaker ${GITHUB_REF_NAME}" \
              --notes "${current_notes}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-assets/*.exe \
              release-assets/*.dmg \
              release-assets/*.zip \
              release-assets/updates.json \
              --verify-tag \
              --generate-notes \
              "${release_flags[@]}" \
              --notes "${macos_notice}" \
              --title "QTierMaker ${GITHUB_REF_NAME}"
          fi

          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            beta_feed_tag="beta-feed"
            if gh release view "${beta_feed_tag}" >/dev/null 2>&1; then
              gh release upload "${beta_feed_tag}" release-assets/updates.json --clobber
            else
              gh release create "${beta_feed_tag}" release-assets/updates.json \
                --target "${GITHUB_SHA}" \
                --prerelease \
                --title "QTierMaker Beta Update Feed" \
                --notes "Rolling update manifest for QTierMaker prereleases."
            fi
          fi
